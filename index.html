<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>दैनिक भास्कर स्पीड न्यूज़ — उज्जैन संस्करण</title>
  <script>
    // Fix: Guarantee correct trailing slash on GitHub Pages so relative paths never 404
    if (window.location.hostname.includes('github.io') && 
        !window.location.pathname.endsWith('/') && 
        !window.location.pathname.endsWith('.html')) {
      window.location.replace(window.location.pathname + '/' + window.location.search + window.location.hash);
    }
  </script>
  <base href="./">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚡</text></svg>">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0a0e17">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rozha+One&family=Yantramanav:wght@400;500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Top App Bar -->
  <header class="app-header">
    <div class="header-left">
      <div class="logo-badge">⚡ स्पीड न्यूज़</div>
      <div class="edition-info">
        <span class="city-tag">उज्जैन</span>
        <span class="date-tag" id="currentDate">04 नवंबर 2026</span>
      </div>
    </div>
    
    <div class="header-right">
      <!-- Speed selector pills -->
      <div class="speed-selector" title="बोलने की रफ़्तार (Playback Speed)">
        <button class="speed-btn" data-speed="1.0">1.0x</button>
        <button class="speed-btn active" data-speed="1.5">1.5x</button>
        <button class="speed-btn" data-speed="2.0">2.0x</button>
      </div>

      <!-- Playlist Drawer Toggle -->
      <button class="icon-btn" id="playlistToggleBtn" title="सभी खबरों की सूची">
        <svg viewBox="0 0 24 24" width="22" height="22" stroke="currentColor" fill="none" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
      </button>
    </div>
  </header>

  <!-- Story Progress Segments -->
  <div class="story-progress-container" id="progressBarContainer">
    <!-- Segments injected dynamically via JS -->
  </div>

  <!-- Main News Stage -->
  <main class="news-stage">
    <!-- News Card Container -->
    <article class="news-card" id="newsCard">
      <!-- Meta & Category Header -->
      <div class="card-meta">
        <span class="category-badge" id="categoryBadge">💡 आज का शुभ विचार</span>
        <span class="counter-badge" id="storyCounter">1 / 24</span>
      </div>

      <!-- Headline -->
      <h1 class="news-headline" id="newsHeadline">
        लोड हो रहा है...
      </h1>

      <!-- Newspaper Clipping (Click to Zoom) -->
      <div class="clipping-frame" id="clippingFrame" title="टैप करके असली अखबार कटिंग ज़ूम करें">
        <img id="clippingImg" src="" alt="अखबार की असली कटिंग" class="clipping-img">
        <div class="zoom-hint">
          <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" fill="none" stroke-width="2.5"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line><line x1="11" y1="8" x2="11" y2="14"></line><line x1="8" y1="11" x2="14" y2="11"></line></svg>
          <span>कटिंग ज़ूम करें (पूरा पढ़ने के लिए)</span>
        </div>
      </div>

      <!-- AI Voiceover & Key Takeaways -->
      <div class="summary-section">
        <!-- Voiceover Text with Audio Waveform -->
        <div class="voiceover-box">
          <div class="voice-indicator" id="voiceIndicator">
            <span class="bar"></span>
            <span class="bar"></span>
            <span class="bar"></span>
            <span class="bar"></span>
          </div>
          <p class="voiceover-text" id="voiceoverText">
            स्पीड न्यूज़ ऑडियो तैयार हो रहा है...
          </p>
        </div>

        <!-- Key Bullet Points -->
        <div class="key-points-box">
          <div class="points-label">📌 मुख्य संदर्भ:</div>
          <ul class="points-list" id="pointsList">
            <!-- Points dynamically loaded -->
          </ul>
        </div>
      </div>
    </article>
  </main>

  <!-- Native HTML5 DOM Audio Engine -->
  <audio id="mainAudio" playsinline preload="auto"></audio>

  <!-- Bottom Playback Control Bar -->
  <footer class="playback-bar">
    <div class="controls-left">
      <button class="icon-btn control-btn" id="prevBtn" title="पिछली खबर (Left Arrow)">
        <svg viewBox="0 0 24 24" width="26" height="26" fill="currentColor"><polygon points="19 20 9 12 19 4 19 20"></polygon><line x1="5" y1="19" x2="5" y2="5" stroke="currentColor" stroke-width="3"></line></svg>
      </button>
    </div>

    <div class="controls-center">
      <button class="play-btn" id="playPauseBtn" title="चलाएं / रोकें (Spacebar)">
        <svg id="playIcon" viewBox="0 0 24 24" width="34" height="34" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
        <svg id="pauseIcon" class="hidden" viewBox="0 0 24 24" width="34" height="34" fill="currentColor"><rect x="6" y="4" width="4" height="16"></rect><rect x="14" y="4" width="4" height="16"></rect></svg>
      </button>
    </div>

    <div class="controls-right">
      <button class="icon-btn control-btn" id="nextBtn" title="अगली खबर (Right Arrow)">
        <svg viewBox="0 0 24 24" width="26" height="26" fill="currentColor"><polygon points="5 4 15 12 5 20 5 4"></polygon><line x1="19" y1="5" x2="19" y2="19" stroke="currentColor" stroke-width="3"></line></svg>
      </button>
    </div>
  </footer>

  <!-- Fullscreen Zoom Lightbox Modal (Pinch & Pan for authentic reading) -->
  <div class="zoom-modal hidden" id="zoomModal">
    <div class="zoom-toolbar">
      <div class="zoom-title" id="zoomHeadline">अखबार की असली कटिंग</div>
      <div class="zoom-actions">
        <button class="icon-btn-sm" id="zoomInBtn" title="Zoom In">+</button>
        <button class="icon-btn-sm" id="zoomOutBtn" title="Zoom Out">−</button>
        <button class="icon-btn-sm" id="zoomResetBtn" title="Reset Zoom">100%</button>
        <button class="icon-btn-sm close-btn" id="zoomCloseBtn" title="Close (Esc)">✕</button>
      </div>
    </div>
    <div class="zoom-viewport" id="zoomViewport">
      <img id="zoomModalImg" src="" alt="High-res Clipping" class="zoom-modal-img">
    </div>
    <div class="zoom-footer-hint">पिंच करें या ड्रैग करके पूरी कटिंग विस्तार से पढ़ें</div>
  </div>

  <!-- Story Playlist Drawer Modal -->
  <aside class="playlist-drawer hidden" id="playlistDrawer">
    <div class="drawer-header">
      <div class="drawer-title">📰 आज की सभी खबरें (<span id="totalStoriesBadge">0</span>)</div>
      <button class="icon-btn-sm close-btn" id="drawerCloseBtn">✕</button>
    </div>
    <div class="drawer-list" id="drawerList">
      <!-- Injected dynamically -->
    </div>
  </aside>
  <div class="drawer-backdrop hidden" id="drawerBackdrop"></div>

  <!-- Scripts -->
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
